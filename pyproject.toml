[project]
name = "research-agent"
version = "0.1.0"
description = "Local LangChain + LangGraph research agent: planning, tool-using researchers, RAG, human-in-the-loop, streaming API, evals."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LLM orchestration
    "langchain>=1.5,<2",
    "langchain-core>=1.8,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-ollama>=1.1,<2",
    # RAG
    "langchain-chroma>=1.1,<2",
    "chromadb>=1.5,<2",
    "langchain-text-splitters>=1.1,<2",
    "pypdf>=7,<8",
    # Tools
    "ddgs>=9.16,<10",
    "trafilatura>=2.3,<3",
    "httpx>=0.28,<1",
    # Serving
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54,<1",
    "sse-starlette>=3.7,<4",
    "pydantic-settings>=2.16,<3",
    "structlog>=25",
    # MCP
    "mcp>=2.3,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "ruff>=0.17",
]

[project.scripts]
research-agent = "research_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs a running Ollama server (deselect with -m 'not integration')"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
