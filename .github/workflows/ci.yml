name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests evals
      - run: uv run ruff format --check src tests evals
      # Unit tests use a fake chat model, so no Ollama or GPU is needed here.
      - run: uv run pytest
